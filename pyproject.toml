[project]
name = "panos-to-scm"
version = "0.1.0"
description = "PAN-OS and Cisco configuration migration tooling for Strata Cloud Manager"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "certifi==2022.12.07",
    "cffi==1.15.1",
    "charset-normalizer==2.1.1",
    "cryptography==42.0.2",
    "idna==3.3",
    "oauthlib==3.2.2",
    "PyJWT==2.4.0",
    "PyYAML==6.0.1",
    "requests==2.31.0",
    "requests-oauthlib==1.3.1",
    "urllib3==1.26.18",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
